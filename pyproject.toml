[project]
name = "yp-video"
version = "1.0.0"
description = "Volleyball video analysis pipeline: download, cut, detect, annotate, train, predict"
requires-python = ">=3.10"
dependencies = [
    # Video decode / probing
    "decord>=0.6.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "pydantic>=2.0",
    # YouTube download
    "yt-dlp>=2026.3.17",
    "yt-dlp-ejs>=0.8.0",
    "pycryptodome>=3.20.0",
    # Cloud storage
    "boto3>=1.34.0",
    # Web application
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "google-genai>=1.0.0",
    # Player ReID: person detection on action frames + embedding clustering.
    # onnxruntime runs the CLIP-ReID embedder (ONNX export; CPU is fast enough
    # for a few hundred crops per video).
    "rfdetr>=1.8.3",
    "scipy>=1.11",
    "onnxruntime>=1.20",
    "orjson>=3.11.9",
    # Audit trail: Cloudflare Access identity + the Postgres it is written to.
    # PyJWT ships PyJWKClient, which fetches and caches the Access JWKS for us.
    "pyjwt[crypto]>=2.10",
    "psycopg[binary,pool]>=3.2",
]


[project.scripts]
# Web Dashboard
yp-app = "yp_video.web.app:run_server"
# Pipeline CLI (按使用順序)
yp-download = "yp_video.youtube.download:main"
# Per-player action clips for a person-centric classifier (actor/clips.py)
yp-action-clips = "yp_video.web.action_clips:main"
# Package a yp_spot.clips.train run for the Inference page's association stage
yp-clip-package = "yp_video.actor.clip_associate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yp_video"]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=8",
    "ruff>=0.9",
]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
# Pinned explicitly (newer ruff defaults keep growing): real errors (E/F)
# plus import hygiene — dead imports and unsorted import blocks are exactly
# what kept slipping into the repo unnoticed.
select = ["E4", "E7", "E9", "F", "I"]
